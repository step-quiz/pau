<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repartiment de continguts · ESO 2025-26</title>
<!-- Anti-flash: amaga el body si no hi ha sessió, auth.js la torna a mostrar -->
<script>
try {
  var _s = JSON.parse(localStorage.getItem('dept-auth-token') || 'null');
  if (!_s || Date.now() > _s.expires) document.documentElement.classList.add('auth-locked');
} catch(e) { document.documentElement.classList.add('auth-locked'); }
</script>
<style>.auth-locked body { visibility: hidden; }</style>
<script src="repartiment-data.js"></script>
<script src="common.js"></script>
<style>
:root {
  --navy:   #1f3a5f;
  --blue:   #2e75b6;
  --blue-bg:#eaf1fa;
  --ink:    #22262b;
  --muted:  #5f5e5a;
  --hint:   #8a8a85;
  --line:   #dfe3ea;
  --bg:     #f4f6f9;
  --card:   #ffffff;

  /* sentit palette */
  --s-comprensio:   #506080; --s-comprensio-bg: #ecf0f7; --s-comprensio-bd: #b0bfcf;
  --s-numeric:      #1a6fa8; --s-numeric-bg:    #e8f2fb; --s-numeric-bd:    #8bbfe0;
  --s-espacial:     #1a8a5c; --s-espacial-bg:   #e5f5ed; --s-espacial-bd:   #80ccaa;
  --s-mesura:       #b56010; --s-mesura-bg:     #fdf3e5; --s-mesura-bd:     #e0aa60;
  --s-algebraic:    #6b3fa0; --s-algebraic-bg:  #f2ecfb; --s-algebraic-bd:  #b090d8;
  --s-estocastic:   #a02848; --s-estocastic-bg: #fde8ef; --s-estocastic-bd: #d888a8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-size: 15px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Shell ─────────────────────────────────────────────────────────── */
.app { min-height: 100dvh; display: flex; flex-direction: column; }

/* ── Topbar ────────────────────────────────────────────────────────── */
.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px; height: 52px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  z-index: 30;
}
.pill-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 13px; border-radius: 20px;
  border: 1px solid var(--line); font-size: 13px; font-weight: 600;
  color: var(--muted); background: var(--card); transition: .12s;
  white-space: nowrap; text-decoration: none;
}
.pill-btn:hover { border-color: var(--navy); color: var(--navy); text-decoration: none; }
.pill-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
.pill-btn.accent { border-color: var(--blue); color: var(--blue); }
.pill-btn.accent:hover { background: var(--blue); color: #fff; }
.brand { font-size: 15px; font-weight: 800; color: var(--navy); flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.badge-immut {
  font-size: 11px; padding: 3px 10px;
  background: #fff8e0; border: 1px solid #e8c840;
  border-radius: 20px; color: #7a6010; font-weight: 700;
  white-space: nowrap;
}

/* ── Tabs bar ──────────────────────────────────────────────────────── */
.tabs-bar {
  flex: 0 0 auto;
  display: flex; gap: 0;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  padding: 0 12px;
  overflow-x: auto;
}
.tabs-bar::-webkit-scrollbar { height: 0; }
.ctab {
  padding: 11px 18px;
  font-size: 13.5px; font-weight: 600;
  color: var(--muted);
  border-bottom: 2.5px solid transparent;
  cursor: pointer; transition: .12s; white-space: nowrap;
  user-select: none;
}
.ctab:hover { color: var(--navy); }
.ctab.active { color: var(--navy); border-bottom-color: var(--navy); }
.ctab .h-badge {
  font-size: 11px; font-weight: 400; color: var(--hint);
  margin-left: 4px;
}

/* ── Main ──────────────────────────────────────────────────────────── */
.main { flex: 1 1 auto; overflow-y: auto; }
.cview { display: none; max-width: 860px; margin: 0 auto; padding: 22px 20px 60px; }
.cview.active { display: block; }

.cview-header {
  display: flex; align-items: baseline; gap: 12px;
  margin-bottom: 20px; padding-bottom: 14px;
  border-bottom: 2px solid var(--line);
}
.cview-header h2 { font-size: 21px; color: var(--navy); }
.cview-header .meta { font-size: 12.5px; color: var(--muted); }

/* ── Sentit section ────────────────────────────────────────────────── */
.s-section {
  margin-bottom: 10px;
  border-radius: 10px; overflow: hidden;
  border: 1px solid var(--line);
}
.s-header {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer; user-select: none;
  transition: filter .1s;
}
.s-header:hover { filter: brightness(.97); }
.s-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.s-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 800; flex: 1; }
.s-hores { font-size: 12px; font-weight: 700; opacity: .7; }
.s-chevron { font-size: 10px; color: rgba(0,0,0,.35); transition: transform .15s; margin-left: 4px; }
.s-section.open .s-chevron { transform: rotate(90deg); }

.s-body { background: var(--card); display: none; }
.s-section.open .s-body { display: block; }

/* ── Tema table ─────────────────────────────────────────────────────── */
.tema-table { width: 100%; border-collapse: collapse; }
.tema-table colgroup col:first-child { width: auto; }
.tema-table colgroup col:last-child  { width: 56px; }

.tema-table thead th {
  text-align: left; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .05em; color: var(--hint);
  padding: 7px 14px 5px; border-bottom: 1px solid var(--line);
}
.tema-table thead th:last-child { text-align: right; }
.tema-row td {
  padding: 9px 14px; border-bottom: 1px solid #eef1f4;
  vertical-align: top;
}
.tema-row:last-child td { border-bottom: none; }
.tema-row:hover td { background: #f6f8fb; }

.tema-toggle {
  display: flex; align-items: flex-start; gap: 8px;
  cursor: pointer; user-select: none;
}
.tema-caret {
  font-size: 9px; color: var(--hint); margin-top: 4px;
  flex-shrink: 0; transition: transform .12s;
}
.tema-toggle.open .tema-caret { transform: rotate(90deg); }
.tema-name { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.35; }

.hores-td { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; padding-top: 10px; }

/* ── Continguts list ───────────────────────────────────────────────── */
.cont-list { display: none; margin-top: 8px; padding-left: 20px; }
.cont-list.open { display: block; }
.cont-list li {
  font-size: 12.5px; color: var(--muted);
  padding: 2px 0; line-height: 1.4;
  list-style: none; display: flex; gap: 7px;
}
.cont-list li::before {
  content: '';
  display: inline-block; width: 4px; height: 4px; border-radius: 50%;
  background: var(--hint); flex-shrink: 0; margin-top: 5.5px;
}
.cont-num { color: var(--hint); font-size: 11px; flex-shrink: 0; margin-top: 1px; }

/* ── Sentit themes (header BG + dot color + border) ────────────────── */
.s-header.comprensio { background: var(--s-comprensio-bg); }
.s-header.comprensio .s-dot   { background: var(--s-comprensio); }
.s-header.comprensio .s-label { color: var(--s-comprensio); }
.s-section.comprensio { border-color: var(--s-comprensio-bd); }

.s-header.numeric    { background: var(--s-numeric-bg); }
.s-header.numeric    .s-dot   { background: var(--s-numeric); }
.s-header.numeric    .s-label { color: var(--s-numeric); }
.s-section.numeric   { border-color: var(--s-numeric-bd); }

.s-header.espacial   { background: var(--s-espacial-bg); }
.s-header.espacial   .s-dot   { background: var(--s-espacial); }
.s-header.espacial   .s-label { color: var(--s-espacial); }
.s-section.espacial  { border-color: var(--s-espacial-bd); }

.s-header.mesura     { background: var(--s-mesura-bg); }
.s-header.mesura     .s-dot   { background: var(--s-mesura); }
.s-header.mesura     .s-label { color: var(--s-mesura); }
.s-section.mesura    { border-color: var(--s-mesura-bd); }

.s-header.algebraic  { background: var(--s-algebraic-bg); }
.s-header.algebraic  .s-dot   { background: var(--s-algebraic); }
.s-header.algebraic  .s-label { color: var(--s-algebraic); }
.s-section.algebraic { border-color: var(--s-algebraic-bd); }

.s-header.estocastic { background: var(--s-estocastic-bg); }
.s-header.estocastic .s-dot   { background: var(--s-estocastic); }
.s-header.estocastic .s-label { color: var(--s-estocastic); }
.s-section.estocastic{ border-color: var(--s-estocastic-bd); }

/* ── Summary footer ─────────────────────────────────────────────────── */
.hores-summary {
  margin-top: 20px; padding: 12px 16px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; display: flex; flex-wrap: wrap; gap: 10px;
}
.hsum-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; color: var(--muted);
}
.hsum-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.hsum-total { font-weight: 700; color: var(--ink); }

/* ── Print ───────────────────────────────────────────────────────────── */
@media print {
  .topbar, .tabs-bar, .pill-btn, .badge-immut { display: none !important; }
  .cview { padding: 0; }
  .s-body { display: block !important; }
  .cont-list { display: block !important; }
  .s-section { break-inside: avoid; margin-bottom: 16px; }
}

/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .brand small { display: none; }
  .badge-immut { display: none; }
  .cview { padding: 14px 12px 50px; }
}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <a class="pill-btn" href="index.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10 4l-5 4 5 4"/></svg>
      Inici
    </a>
    <div class="brand">Repartiment de continguts <small>ESO · 2025-26</small></div>
    <div class="badge-immut">◉ Document immutable</div>
    <a class="pill-btn accent" href="seguiment.html">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"/><path d="M5 8.5l2 2 4-4"/></svg>
      Seguiment
    </a>
    <button class="pill-btn" onclick="window.print()" title="Imprimeix">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="6" rx="1"/><path d="M5 7V3.5a.5.5 0 0 1 .5-.5h5a.5.5 0 0 1 .5.5V7M5 13v-2h6v2"/></svg>
      Imprimir
    </button>
  </header>

  <div class="tabs-bar" id="tabsBar"></div>
  <main class="main" id="main"></main>

</div><!-- /.app -->

<script>
/* ─── CONFIG ──────────────────────────────────────────────────────── */
const CURS_ORDER  = ['1ESO', '2ESO', '3ESO', '4ESO'];
const CURS_LABELS = { '1ESO':'1r ESO', '2ESO':'2n ESO', '3ESO':'3r ESO', '4ESO':'4t ESO' };

/* ─── STATE ───────────────────────────────────────────────────────── */
let activeCurs = '1ESO';

/* ─── RENDER ──────────────────────────────────────────────────────── */

function renderTabs() {
  document.getElementById('tabsBar').innerHTML = CURS_ORDER.map(c => {
    const d = REPARTIMENT[c];
    return `<div class="ctab${c===activeCurs?' active':''}" data-curs="${c}">
      ${escHtml(CURS_LABELS[c])}
      <span class="h-badge">${d.hores_any}h</span>
    </div>`;
  }).join('');
}

function renderMain() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  for (const curs of CURS_ORDER) {
    main.appendChild(buildCursView(curs));
  }
}

function buildCursView(curs) {
  const d = REPARTIMENT[curs];
  const div = document.createElement('div');
  div.className = 'cview' + (curs === activeCurs ? ' active' : '');
  div.id = 'cv-' + curs;

  let html = `<div class="cview-header">
    <h2>${escHtml(d.label)}</h2>
    <span class="meta">${d.hores_any}h anuals &mdash; ${escHtml(d.hores_info)}</span>
  </div>`;

  for (const bloc of d.blocs) {
    const sm = SENTITS[bloc.sentit];
    const sid = `${curs}__${bloc.sentit}`;
    html += `<div class="s-section ${bloc.sentit}" id="ss-${sid}">
      <div class="s-header ${bloc.sentit}" data-sid="${sid}">
        <div class="s-dot"></div>
        <div class="s-label">${escHtml(sm.label)}</div>
        <div class="s-hores">${bloc.hores}h</div>
        <span class="s-chevron">▶</span>
      </div>
      <div class="s-body">
        <table class="tema-table">
          <colgroup><col/><col/></colgroup>
          <thead><tr><th>Tema</th><th style="text-align:right">Hores</th></tr></thead>
          <tbody>
          ${bloc.temes.map(t => buildTemaRow(curs, bloc.sentit, t)).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  // Hours summary
  const totals = {};
  for (const bloc of d.blocs) totals[bloc.sentit] = (totals[bloc.sentit]||0) + bloc.hores;
  html += `<div class="hores-summary">
    ${Object.entries(totals).map(([s,h]) => `
      <div class="hsum-item">
        <div class="hsum-dot" style="background:var(--s-${s})"></div>
        <span>${escHtml(SENTITS[s].short)}</span>
        <strong>${h}h</strong>
      </div>`).join('')}
    <div class="hsum-item" style="margin-left:auto">
      Total: <strong class="hsum-total">${d.hores_any}h</strong>
    </div>
  </div>`;

  div.innerHTML = html;
  return div;
}

function buildTemaRow(curs, sentit, t) {
  const rid = `${curs}__${sentit}__${t.id}`;
  const items = t.continguts.map((c, i) =>
    `<li><span class="cont-num">${i+1}.</span><span>${escHtml(c)}</span></li>`
  ).join('');
  return `<tr class="tema-row">
    <td>
      <div class="tema-toggle" data-rid="${rid}">
        <span class="tema-caret">▶</span>
        <span class="tema-name">${escHtml(t.label)}</span>
      </div>
      <ul class="cont-list" id="cl-${rid}">${items}</ul>
    </td>
    <td class="hores-td">${t.hores}h</td>
  </tr>`;
}

/* ─── ACTIONS ─────────────────────────────────────────────────────── */

function switchCurs(curs) {
  activeCurs = curs;
  document.querySelectorAll('.ctab').forEach(t =>
    t.classList.toggle('active', t.dataset.curs === curs));
  document.querySelectorAll('.cview').forEach(v =>
    v.classList.toggle('active', v.id === 'cv-' + curs));
}

function toggleSection(sid) {
  const sec = document.getElementById('ss-' + sid);
  sec.classList.toggle('open');
}

function toggleTema(rid) {
  const tog = document.querySelector(`.tema-toggle[data-rid="${rid}"]`);
  const list = document.getElementById('cl-' + rid);
  const open = tog.classList.toggle('open');
  list.classList.toggle('open', open);
}

/* ─── EVENTS ──────────────────────────────────────────────────────── */

document.getElementById('tabsBar').addEventListener('click', e => {
  const tab = e.target.closest('.ctab');
  if (tab) switchCurs(tab.dataset.curs);
});

document.getElementById('main').addEventListener('click', e => {
  const hdr = e.target.closest('.s-header');
  if (hdr) { toggleSection(hdr.dataset.sid); return; }
  const tog = e.target.closest('.tema-toggle');
  if (tog) { toggleTema(tog.dataset.rid); }
});

/* ─── INIT ────────────────────────────────────────────────────────── */
renderTabs();
renderMain();
// Open all sentit sections of the active course by default
REPARTIMENT[activeCurs].blocs.forEach(b =>
  document.getElementById(`ss-${activeCurs}__${b.sentit}`)?.classList.add('open'));
</script>
<script src="auth.js"></script>
</body>
</html>
