<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material de matemàtiques — Cerca</title>
<style>
  /* ── Design tokens ──────────────────────────────────────────────── */
  :root {
    --bg:        #f5f5f7;
    --surface:   #ffffff;
    --surface-2: #fafafa;
    --surface-3: #f0f0f3;
    --text:      #1d1d1f;
    --text-2:    #6e6e73;
    --text-3:    #aeaeb2;
    --accent:    #0071e3;
    --accent-soft: rgba(0,113,227,.10);
    --green:     #34c759;
    --amber:     #ff9f0a;
    --purple:    #bf5af2;
    --red:       #ff3b30;
    --divider:   rgba(0,0,0,.07);
    --divider-2: rgba(0,0,0,.04);
    --radius:    14px;
    --radius-sm: 8px;
    --radius-xs: 5px;
    --sh:        0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.05);
    --sh-md:     0 4px 16px rgba(0,0,0,.07), 0 2px 6px rgba(0,0,0,.04);
    --sh-lg:     0 16px 48px rgba(0,0,0,.10), 0 4px 12px rgba(0,0,0,.06);
    --ease:      cubic-bezier(.4,0,.2,1);
    --spring:    cubic-bezier(.34,1.56,.64,1);
    --mono:      ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 16px;
    line-height: 1.45;
  }

  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  ul { list-style: none; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ── Topbar ─────────────────────────────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    display: grid;
    grid-template-columns: 196px 1fr auto;  /* rail · search · recents */
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: rgba(255,255,255,.88);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--divider);
  }
  .search-wrap {
    position: relative;
    max-width: 560px;
    width: 100%;
    justify-self: start;
  }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--text-3); pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 8px 12px 8px 34px;
    background: var(--surface-3);
    border: 1px solid transparent;
    border-radius: 980px;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  #search:focus {
    outline: none;
    background: var(--surface);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  /* ── Recents ────────────────────────────────────────────────────── */
  .recents-wrap { position: relative; justify-self: end; }
  .recents-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 980px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-2);
    background: var(--surface-3);
    border: 1px solid transparent;
    transition: background .12s, color .12s, border-color .12s;
    white-space: nowrap;
  }
  .recents-btn svg { width: 15px; height: 15px; }
  .recents-btn.icon-only { gap: 0; padding: 8px; width: 38px; height: 38px; justify-content: center; }
  .recents-btn.icon-only svg { width: 17px; height: 17px; }
  .recents-btn:hover { background: rgba(0,113,227,.18); color: var(--text); box-shadow: inset 0 0 0 2px #000; border-color: transparent; }
  .recents-wrap.is-open .recents-btn {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--text);
  }

  .recents-menu {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 340px;
    max-width: 90vw;
    max-height: min(440px, 70vh);
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    box-shadow: var(--sh-md);
    padding: 6px;
    z-index: 60;
    animation: fade-up .18s var(--ease);
  }
  .recents-menu[hidden] { display: none; }
  .recents-menu .rec-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px 8px;
    font-size: 10px; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--text-3);
  }
  .recents-menu .rec-clear {
    font-size: 11px; font-weight: 600;
    color: var(--text-3);
    text-transform: none; letter-spacing: 0;
    padding: 2px 6px; border-radius: 6px;
  }
  .recents-menu .rec-clear:hover { color: var(--red); background: var(--surface-2); }
  .recents-menu .rec-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 8px 8px;
    border-radius: var(--radius-sm);
    text-align: left;
    transition: background .12s;
    cursor: pointer;
  }
  .recents-menu .rec-item:hover { background: var(--surface-3); }
  .recents-menu .rec-icon {
    flex-shrink: 0;
    width: 28px; height: 28px;
    border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700;
  }
  .recents-menu .rec-icon[data-format=pdf] { color: #c0392b; background: rgba(192,57,43,.08); }
  .recents-menu .rec-icon[data-format=doc] { color: #2563eb; background: rgba(37,99,235,.08); }
  .recents-menu .rec-body { flex: 1; min-width: 0; }
  .recents-menu .rec-title {
    font-size: 12.5px; font-weight: 500; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recents-menu .rec-when { font-size: 10.5px; color: var(--text-3); margin-top: 1px; }
  .recents-menu .rec-empty {
    padding: 18px 12px; text-align: center;
    font-size: 12.5px; color: var(--text-3); line-height: 1.5;
  }

  /* ── Layout ─────────────────────────────────────────────────────── */
  .layout {
    display: grid;
    grid-template-columns: 224px 1fr 0;
    height: calc(100vh - 57px);
    height: calc(100dvh - 57px);
    transition: grid-template-columns .25s var(--ease);
  }
  .layout.has-preview {
    grid-template-columns: 224px minmax(380px, 1fr) minmax(420px, 620px);
  }

  /* ── Filter rail ────────────────────────────────────────────────── */
  .filter-rail {
    border-right: 1px solid var(--divider);
    overflow-y: auto;
    padding: 10px 14px 80px;
    background: var(--surface-2);
  }
  .filter-rail h3 {
    font-size: 9.68px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-3);
    margin: 14px 4px 8px;
  }
  .filter-rail h3:first-child { margin-top: 4px; }

  /* Mode toggle (Bàsic / Avançat) */
  .mode-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--surface-3);
    border-radius: 980px;
    padding: 3px;
    margin-bottom: 4px;
  }
  .mode-toggle button {
    padding: 6px 10px;
    border-radius: 980px;
    font-size: 10.56px;
    font-weight: 600;
    color: var(--text-2);
    transition: background .15s, color .15s, box-shadow .15s;
  }
  .mode-toggle button.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--sh);
  }
  .mode-toggle button:hover {
    background: rgba(0,113,227,.18);
    color: var(--text);
    box-shadow: inset 0 0 0 2px #000;
  }

  .mode-hint {
    margin: 8px 4px 0;
    padding: 8px 10px;
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: var(--radius-sm);
    font-size: 9.68px;
    line-height: 1.4;
  }

  /* Activity blocks (advanced mode only) */
  .filter-block {
    padding: 4px 0 6px;
  }
  .filter-block + .filter-block {
    border-top: 1px solid var(--divider-2);
    margin-top: 4px;
  }
  .filter-block-label {
    font-size: 8.8px;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-3);
    padding: 6px 10px 4px;
  }

  .filter-group {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 3.2px 6px;
    margin-bottom: 6.4px;
    box-shadow: var(--sh);
  }
  .filter-group summary {
    list-style: none;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    padding: 4.8px 10px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 13.2px;
    user-select: none;
    border: 1px solid transparent;
  }
  .filter-group summary::-webkit-details-marker { display: none; }
  .filter-group summary:hover {
    background: #e2e2e7;
    border-color: #1d1d1f;
  }
  .filter-group .group-label { flex: 1; }
  .filter-group .group-count {
    font-size: 8.8px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 2px 7px;
    border-radius: 980px;
    min-width: 18px;
    text-align: center;
  }
  .filter-group .group-count:empty { display: none; }
  .filter-group .group-caret {
    width: 10px; height: 10px;
    color: var(--text-3);
    transition: transform .15s;
  }
  .filter-group[open] .group-caret { transform: rotate(90deg); }

  .filter-list { padding: 1.6px 4px 4.8px; }
  .filter-item {
    display: flex; align-items: center; gap: 8px;
    padding: 3.2px 8px;
    border-radius: var(--radius-xs);
    cursor: pointer;
    font-size: 13.2px;
    transition: background .12s, border-color .12s;
    border: 1px solid transparent;
  }
  .filter-item:hover {
    background: #e2e2e7;
    border-color: #1d1d1f;
  }
  .filter-item input[type=checkbox] {
    width: 14px; height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .filter-item .fi-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .filter-item .fi-count {
    font-size: 9.68px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }
  .filter-item.is-zero { opacity: .4; }
  .filter-item.is-zero:hover { opacity: .7; }

  .filter-rail .clear-all {
    width: 100%;
    margin-top: 10px;
    padding: 9px;
    border-radius: var(--radius-sm);
    font-size: 10.56px; font-weight: 600;
    color: var(--text-2);
    background: var(--surface);
    box-shadow: var(--sh);
    transition: background .15s, color .15s;
  }
  .filter-rail .clear-all:hover { background: var(--red); color: #fff; }
  .filter-rail .clear-all:disabled { opacity: .4; cursor: default; background: var(--surface); color: var(--text-3); }

  /* ── Results ────────────────────────────────────────────────────── */
  .results-wrap {
    overflow-y: auto;
    padding: 16px 22px 60px;
  }
  .chip-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 10px;
    min-height: 0;
  }
  .chip-row:empty { margin-bottom: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 6px 4px 10px;
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: 980px;
    font-size: 11px;
    color: var(--text-2);
    box-shadow: var(--sh);
  }
  .chip .chip-x {
    width: 16px; height: 16px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-3);
    transition: background .12s, color .12s;
  }
  .chip .chip-x:hover { background: var(--red); color: #fff; }
  .chip .chip-x svg { width: 8px; height: 8px; }
  .chip.chip-query { color: var(--accent); }

  .results {
    display: flex; flex-direction: column;
    gap: 7px;
    align-items: start;
  }
  /* When the preview drawer is open, cards fill the (now narrow) results column */
  .layout.has-preview .results { align-items: stretch; }
  .layout.has-preview .card { width: 100%; }
  .layout.has-preview .card-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Card ───────────────────────────────────────────────────────── */
  .card {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    width: max-content;
    min-width: 320px;
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: var(--radius-sm);
    box-shadow: inset 3px 0 0 transparent;
    transition:
      box-shadow .18s var(--ease),
      transform  .18s var(--ease),
      background .18s var(--ease),
      border-color .18s var(--ease);
    animation: fade-up .25s var(--ease) both;
    cursor: pointer;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card.is-open {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .card:hover { box-shadow: inset 6px 0 0 #000; transform: translateX(2px); }

  .card .card-icon {
    width: 30px; height: 36px;
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(0,113,227,.10), transparent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 9px; font-weight: 700;
    letter-spacing: .04em;
    flex-shrink: 0;
  }
  .card[data-format=pdf]  .card-icon { color: #c0392b; background: rgba(192,57,43,.08); }
  .card[data-format=doc]  .card-icon { color: #2563eb; background: rgba(37,99,235,.08); }

  .card-main { min-width: 0; }
  .card-title {
    font-size: 15.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.35;
    margin-bottom: 4px;
  }
  .card-meta {
    display: flex; align-items: center; flex-wrap: wrap;
    gap: 4px 6px;
    font-size: 12.5px;
    color: var(--text-2);
  }

  .pill {
    display: inline-flex; align-items: center;
    padding: 1px 7px;
    border-radius: 980px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .01em;
    line-height: 1.6;
    white-space: nowrap;
    background: var(--surface-3);
    color: var(--text-2);
  }

  .card-actions {
    display: none;
    gap: 6px;
  }
  .card.is-open .card-actions { display: flex; }
  .card-actions .btn-act {
    padding: 7px 12px;
    border-radius: 980px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--divider);
    background: var(--surface);
    color: var(--text);
    transition: background .12s, border-color .12s, transform .12s;
  }
  .card-actions .btn-act:hover { background: var(--surface-3); }
  .card-actions .btn-act.btn-prim {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .card-actions .btn-act.btn-prim:hover { background: #0064cc; }
  .card-actions .btn-act:active { transform: scale(.96); }

  /* Empty / loading / error */
  .state-empty, .state-loading, .state-error {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-2);
  }
  .state-empty .se-icon { font-size: 32px; margin-bottom: 12px; opacity: .5; }
  .state-empty p { margin: 4px 0; }
  .state-empty button { margin-top: 14px; padding: 8px 16px; border-radius: 980px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
  .state-error { color: var(--red); }
  .state-error code { font-family: var(--mono); font-size: 12px; padding: 2px 6px; background: var(--surface-3); border-radius: 4px; color: var(--text); }

  .skel {
    height: 60px;
    background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface-3) 50%, var(--surface-2) 100%);
    background-size: 200% 100%;
    border-radius: var(--radius-sm);
    animation: shimmer 1.4s ease-in-out infinite;
    margin-bottom: 6px;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── Preview drawer ─────────────────────────────────────────────── */
  .preview-drawer {
    border-left: 1px solid var(--divider);
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .preview-drawer[hidden] { display: none; }

  .preview-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--divider);
    flex-shrink: 0;
  }
  .preview-head .pv-title {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .preview-head .pv-close {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--surface-3);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-2);
    transition: background .12s;
    flex-shrink: 0;
  }
  .preview-head .pv-close:hover { background: var(--red); color: #fff; }
  .preview-head .pv-close svg { width: 12px; height: 12px; }

  .preview-body { flex: 1; overflow: hidden; min-height: 0; position: relative; }
  .preview-body iframe { width: 100%; height: 100%; border: none; display: block; }

  /* ── Footer ─────────────────────────────────────────────────────── */
  .footer-note {
    position: fixed; left: 0; bottom: 0;
    padding: 6px 14px;
    font-size: 10px; color: var(--text-3);
    pointer-events: none;
  }
  .footer-note a { color: var(--text-3); pointer-events: auto; }

  /* ── Top-right cluster (Configuració + Recents) ─────────────────── */
  .topbar-right { justify-self: end; display: flex; align-items: center; gap: 10px; }

  /* Standalone topbar links (Repositori, Filtrar CB) — same pill as the dropdowns */
  .link-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 980px;
    font-size: 13px; font-weight: 600;
    color: var(--text-2);
    background: var(--surface-3);
    border: 1px solid transparent;
    text-decoration: none;
    transition: background .12s, color .12s, box-shadow .12s;
    white-space: nowrap;
  }
  .link-btn svg { width: 15px; height: 15px; }

  .config-wrap { position: relative; }
  .config-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-radius: 980px;
    font-size: 13px; font-weight: 600;
    color: var(--text-2);
    background: var(--surface-3);
    border: 1px solid transparent;
    transition: background .12s, color .12s, border-color .12s;
    white-space: nowrap;
  }
  .config-btn svg { width: 15px; height: 15px; }
  .config-btn:hover { background: rgba(0,113,227,.18); color: var(--text); box-shadow: inset 0 0 0 2px #000; border-color: transparent; }
  .link-btn:hover   { background: rgba(0,113,227,.18); color: var(--text); box-shadow: inset 0 0 0 2px #000; text-decoration: none; }
  .config-wrap.is-open .config-btn {
    background: var(--surface);
    border-color: var(--accent);
    color: var(--text);
  }

  .config-menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 280px; max-width: 90vw;
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    box-shadow: var(--sh-md);
    padding: 6px;
    z-index: 60;
    animation: fade-up .18s var(--ease);
  }
  .config-menu[hidden] { display: none; }
  .config-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    color: var(--text);
    text-decoration: none;
  }
  .config-item:hover { background: var(--surface-3); text-decoration: none; }
  .config-item svg { width: 16px; height: 16px; color: var(--text-2); flex-shrink: 0; }
  .config-item.cfg-ai { color: var(--accent); font-weight: 600; }
  .config-item.cfg-ai svg { color: var(--accent); }
  .cfg-sep { height: 1px; background: var(--divider); margin: 5px 8px; }

  /* ── Pristine hint state (no filter, no search) ─────────────────── */
  .results > .state-hint { align-self: stretch; width: 100%; }
  .state-hint {
    position: relative;
    min-height: min(62vh, 480px);
    padding: 6px 0;
  }
  .hint-bubble {
    position: absolute;
    display: inline-flex; align-items: flex-start;
    gap: 11px;
    max-width: 300px;
    padding: 13px 17px;
    background: var(--surface);
    border: 1px solid var(--divider);
    border-radius: var(--radius);
    box-shadow: var(--sh-md);
    font-size: 13.5px; font-weight: 500;
    color: var(--text);
    line-height: 1.4;
  }
  .hint-bubble .hint-arrow {
    flex-shrink: 0;
    width: 22px; height: 22px;
    color: var(--accent);

  .hint-bubble--search  { top: 6px;  left: 2px; }

  .hint-bubble--search  .hint-arrow { animation: nudge-up 1s var(--ease) infinite; }

  @keyframes nudge-up   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* ── Small screens (best-effort, not optimized) ─────────────────── */
  @media (max-width: 900px) {

  /* A2 — Anell de focus coherent (:focus-visible) */

</style>

<script>
/* ═══════════════════════════════════════════════════════════════════
   Material finder — vanilla JS, no dependencies.
   ═══════════════════════════════════════════════════════════════════ */

/* ─── CONFIG ────────────────────────────────────────────────────── */
const MANIFEST_URL = 'manifest.json';

/* ─── STATE ─────────────────────────────────────────────────────── */
const state = {
  manifest: null,
  vocabLabels: {},
  query: '',
  filters: {},                  // { groupKey: Set([values]) }
  openId: null,                 // card actualment expandida amb les dues accions
  previewing: false,            // si el panell lateral està obert mostrant l'iframe
  filterCollapsed: { format: true, type: true },
  uiMode: 'basic',              // 'basic' | 'advanced' — persistit a localStorage
};
FILTER_GROUPS.forEach(g => state.filters[g.key] = new Set());

/* ─── DOM REFS ──────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
const els = {
  layout:        $('layout'),
  filterRail:    $('filter-rail'),
  chipRow:       $('chip-row'),
  results:       $('results'),
  preview:       $('preview-drawer'),
  search:        $('search'),
  recentsWrap:   $('recents-wrap'),
  recentsBtn:    $('recents-btn'),
  recentsMenu:   $('recents-menu'),
  configWrap:    $('config-wrap'),
  configBtn:     $('config-btn'),
  configMenu:    $('config-menu'),
};

/* ─── RECENTS (localStorage) ────────────────────────────────────── */
const RECENTS_KEY = 'material:recents';
const RECENTS_MAX = 10;

function getRecents() {
  try {
    const raw = localStorage.getItem(RECENTS_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function pushRecent(id) {
  if (!id) return;
  let list = getRecents().filter(r => r.id !== id);   // dedup: remove existing
  list.unshift({ id, ts: Date.now() });               // newest first
  list = list.slice(0, RECENTS_MAX);                   // cap at 10
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(list)); } catch (e) {}
}

function clearRecents() {
  try { localStorage.removeItem(RECENTS_KEY); } catch (e) {}
  renderRecentsMenu();
}

function relativeTime(ts) {
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1)  return 'ara mateix';
  if (min < 60) return `fa ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24)   return `fa ${h} h`;
  const d = Math.floor(h / 24);
  if (d === 1)  return 'ahir';
  if (d < 7)    return `fa ${d} dies`;
  const w = Math.floor(d / 7);
  if (w < 5)    return `fa ${w} setmana${w === 1 ? '' : 'nes'}`;
  const mo = Math.floor(d / 30);
  return `fa ${mo} mes${mo === 1 ? '' : 'os'}`;
}

function renderRecentsMenu() {
  const list = getRecents();
  const byId = new Map((state.manifest?.files || []).map(f => [f.id, f]));
  // Keep only recents that still exist in the manifest.
  const items = list.map(r => ({ rec: r, file: byId.get(r.id) })).filter(x => x.file);

  if (!items.length) {
    els.recentsMenu.innerHTML = `
      <div class="rec-head"><span>Recents</span></div>
      <div class="rec-empty">Encara no has obert cap document al Drive.<br>Els que obris apareixeran aquí.</div>`;
    return;
  }

  els.recentsMenu.innerHTML = `
    <div class="rec-head">
      <span>Oberts recentment</span>
      <button class="rec-clear" id="rec-clear">Esborra</button>
    </div>
    ${items.map(({ rec, file }) => `
      <button class="rec-item" data-id="${escHtml(file.id)}">
        <span class="rec-icon" data-format="${escHtml(file.format || '')}">${escHtml((file.format || '?').toUpperCase())}</span>
        <span class="rec-body">
          <span class="rec-title">${escHtml(file.title)}</span>
          <span class="rec-when">${escHtml(relativeTime(rec.ts))}</span>
        </span>
      </button>`).join('')}
  `;

  const clr = $('rec-clear');
  if (clr) clr.onclick = (e) => { e.stopPropagation(); clearRecents(); };
}

function toggleRecentsMenu(force) {
  const open = force !== undefined ? force : els.recentsMenu.hidden;
  if (open) {
    toggleConfigMenu(false);
    renderRecentsMenu();
    els.recentsMenu.hidden = false;
    els.recentsWrap.classList.add('is-open');
    els.recentsBtn.setAttribute('aria-expanded', 'true');
  } else {
    els.recentsMenu.hidden = true;
    els.recentsWrap.classList.remove('is-open');
    els.recentsBtn.setAttribute('aria-expanded', 'false');
  }
}

function toggleConfigMenu(force) {
  const open = force !== undefined ? force : els.configMenu.hidden;
  if (open) {
    toggleRecentsMenu(false);
    els.configMenu.hidden = false;
    els.configWrap.classList.add('is-open');
    els.configBtn.setAttribute('aria-expanded', 'true');
  } else {
    els.configMenu.hidden = true;
    els.configWrap.classList.remove('is-open');
    els.configBtn.setAttribute('aria-expanded', 'false');
  }
}

/* ═══════════════════════════════════════════════════════════════════
   UTIL — normalize, fuzzy match, labels
   ═══════════════════════════════════════════════════════════════════ */


function damerauLevenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  const d = Array.from({length: m + 1}, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) d[i][0] = i;
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      d[i][j] = Math.min(
        d[i-1][j]   + 1,
        d[i][j-1]   + 1,
        d[i-1][j-1] + cost
      );
      if (i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) {
        d[i][j] = Math.min(d[i][j], d[i-2][j-2] + 1);
      }
    }
  }
  return d[m][n];
}

/* Returns score per token: 100 exact, 60 distance-1, 0 no match */
function scoreToken(blob, token) {
  if (!token) return 0;
  if (blob.indexOf(token) >= 0) return 100;
  if (token.length < 4) return 0;
  // Scan windows of length L-1, L, L+1 in the blob
  const L = token.length;
  for (const wl of [L, L - 1, L + 1]) {
    if (wl < 2 || wl > blob.length) continue;
    for (let i = 0; i + wl <= blob.length; i++) {
      const w = blob.substring(i, i + wl);
      if (damerauLevenshtein(token, w) <= 1) return 60;
    }
  }
  return 0;
}

function matchesQuery(file, queryTokens) {
  if (!queryTokens.length) return { ok: true, score: 0 };
  let total = 0;
  for (const t of queryTokens) {
    const sBlob  = scoreToken(file._blob, t);
    if (sBlob === 0) return { ok: false, score: 0 };
    // E2: ponderar per camp — títol (×3) > camps principals (×2) > notes/altres (×1)
    const sTitle = scoreToken(file._blobTitle, t);
    const sMain  = scoreToken(file._blobMain, t);
    total += Math.max(sTitle * 3, sMain * 2, sBlob);
  }
  return { ok: true, score: total };
}

function label(value) {
  if (!value && value !== 0) return '';
  if (state.vocabLabels[value]) return state.vocabLabels[value];
  return String(value).replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}


/* Course umbrella matching: a filter on '3ESO' matches files tagged
   ['3ESO'] or ['ESO']. A file with NO course tags matches every course
   filter (it is considered universally relevant). */
function fileMatchesCourse(file, requested) {
  const tags = file.courses || [];
  if (tags.length === 0) return true;
  if (tags.includes(requested)) return true;
  if (tags.includes('ESO')  && ESO_COURSES.includes(requested))  return true;
  if (tags.includes('Bat')  && BATX_COURSES.includes(requested)) return true;
  return false;
}

/* For a given filter group, does the file pass the group's selection? */
function fileMatchesGroup(file, group, selectedSet) {
  if (!selectedSet || !selectedSet.size) return true;
  if (group.key === 'course') {
    for (const req of selectedSet) if (fileMatchesCourse(file, req)) return true;
    return false;
  }
  const v = file[group.field];
  if (Array.isArray(v)) {
    for (const x of v) if (selectedSet.has(x)) return true;
    return false;
  }
  return selectedSet.has(v);
}

function fileMatchesAllFilters(file) {
  for (const g of FILTER_GROUPS) {
    if (!fileMatchesGroup(file, g, state.filters[g.key])) return false;
  }
  return true;
}

/* ═══════════════════════════════════════════════════════════════════
   FILTER ENGINE — main compute
   ═══════════════════════════════════════════════════════════════════ */

function computeFiltered() {
  if (!state.manifest) return [];
  const queryTokens = normalize(state.query).split(' ').filter(Boolean);
  const out = [];
  for (const f of state.manifest.files) {
    if (!fileMatchesAllFilters(f)) continue;
    const m = matchesQuery(f, queryTokens);
    if (!m.ok) continue;
    out.push({ file: f, score: m.score });
  }
  if (queryTokens.length) {
    out.sort((a, b) => b.score - a.score || a.file.title.localeCompare(b.file.title));
  } else {
    out.sort((a, b) => a.file.title.localeCompare(b.file.title));
  }
  return out.map(x => x.file);
}

/* "Net": cap filtre seleccionat i cap cerca escrita. */
function isPristine() {
  return !state.query && !FILTER_GROUPS.some(G => state.filters[G.key].size > 0);
}

/* Per-checkbox counts: for each group G and each value V,
   count files matching all filters EXCEPT G, AND value V is set/has V. */
function computeCounts() {
  const counts = {};
  if (!state.manifest) return counts;
  const queryTokens = normalize(state.query).split(' ').filter(Boolean);

  // Pre-filter: files that match query and ALL filters except for G
  for (const G of FILTER_GROUPS) {
    counts[G.key] = {};
    const passQueryAndOthers = state.manifest.files.filter(f => {
      const m = matchesQuery(f, queryTokens);
      if (!m.ok) return false;
      for (const H of FILTER_GROUPS) {
        if (H.key === G.key) continue;
        if (!fileMatchesGroup(f, H, state.filters[H.key])) return false;
      }
      return true;
    });
    const values = state.manifest.vocabulary[G.key] || [];
    for (const v of values) {
      let c = 0;
      for (const f of passQueryAndOthers) {
        if (G.key === 'course' ? fileMatchesCourse(f, v)
            : (Array.isArray(f[G.field]) ? f[G.field].includes(v) : f[G.field] === v)) {
          c++;
        }
      }
      counts[G.key][v] = c;
    }
  }
  return counts;
}

/* ═══════════════════════════════════════════════════════════════════
   RENDER — filters, chips, results, preview
   ═══════════════════════════════════════════════════════════════════ */

function renderFilters() {
  if (!state.manifest) return;
  const counts = computeCounts();
  const mode = state.uiMode;
  const basic = state.manifest.basic || {};
  const blocks = state.manifest.activity_blocks || [];

  // For each group, decide which values to show.
  // - basic: only the slugs whitelisted in manifest.basic[G.key]; if the group
  //   has no entry in manifest.basic, the whole group is hidden.
  // - advanced: all values from vocabulary[G.key].
  function valuesFor(G) {
    const all = state.manifest.vocabulary[G.key] || [];
    if (mode === 'advanced') return all;
    const allow = basic[G.key];
    if (!allow) return null;                     // group hidden in basic
    const allowSet = new Set(allow);
    return all.filter(v => allowSet.has(v));     // preserve manifest order
  }

  function renderItem(G, v) {
    const c = counts[G.key]?.[v] ?? 0;
    const checked = state.filters[G.key].has(v);
    const zero = !checked && c === 0;
    return `
      <label class="filter-item ${zero ? 'is-zero' : ''}">
        <input type="checkbox" data-group="${G.key}" data-value="${escHtml(v)}" ${checked ? 'checked' : ''}>
        <span class="fi-label">${escHtml(label(v))}</span>
      </label>`;
  }

  const html = FILTER_GROUPS.map(G => {
    const values = valuesFor(G);
    if (values === null) return '';              // group hidden
    const sel = state.filters[G.key];
    const open = state.filterCollapsed[G.key] !== true;
    const selSize = sel.size;

    // Special case: in advanced mode, render Activity grouped by blocks.
    let body;
    if (G.key === 'activity' && mode === 'advanced' && blocks.length) {
      body = blocks.map(b => `
        <div class="filter-block">
          <div class="filter-block-label">${escHtml(b.label)}</div>
          <div class="filter-list">
            ${b.items.map(v => renderItem(G, v)).join('')}
          </div>
        </div>`).join('');
    } else {
      body = `<div class="filter-list">${values.map(v => renderItem(G, v)).join('')}</div>`;
    }

    return `
      <details class="filter-group" ${open ? 'open' : ''} data-group="${G.key}">
        <summary>
          <svg class="group-caret" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
            <path d="M3 1l4 4-4 4z"/>
          </svg>
          <span class="group-label">${escHtml(G.label)}</span>
          <span class="group-count">${selSize ? selSize : ''}</span>
        </summary>
        ${body}
      </details>`;
  }).join('');

  const hasAny = FILTER_GROUPS.some(G => state.filters[G.key].size > 0) || state.query;
  // Count active filters from groups hidden in basic — useful so the user
  // knows why some chips are showing without a matching rail entry.
  let hiddenActive = 0;
  if (mode === 'basic') {
    for (const G of FILTER_GROUPS) {
      const values = valuesFor(G);
      const allow = values ? new Set(values) : new Set();
      for (const v of state.filters[G.key]) if (!allow.has(v)) hiddenActive++;
    }
  }

  els.filterRail.innerHTML = `
    ${hiddenActive ? `<div class="mode-hint">Tens ${hiddenActive} filtre${hiddenActive===1?'':'s'} actiu${hiddenActive===1?'':'s'} només visible${hiddenActive===1?'':'s'} a Avançat.</div>` : ''}
    ${html}
    <button class="clear-all" ${hasAny ? '' : 'disabled'}>Esborra-ho tot</button>
  `;

  updateModeToggle();
}

function updateModeToggle() {
  const b = $('mode-basic'), a = $('mode-advanced');
  if (b) { b.classList.toggle('active', state.uiMode === 'basic');    b.setAttribute('aria-pressed', state.uiMode === 'basic'     ? 'true' : 'false'); }
  if (a) { a.classList.toggle('active', state.uiMode === 'advanced'); a.setAttribute('aria-pressed', state.uiMode === 'advanced'  ? 'true' : 'false'); }
}

function setMode(m) {
  if (state.uiMode === m) return;
  state.uiMode = m;
  try { localStorage.setItem('material:uiMode', m); } catch (e) {}
  renderAll();
}

function renderChips() {
  const chips = [];
  if (state.query) {
    chips.push(`<span class="chip chip-query">
      <span>Cerca: "${escHtml(state.query)}"</span>
      <button class="chip-x" data-chip-clear="query" title="Esborra cerca">
        <svg viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l6 6M7 1l-6 6"/></svg>
      </button>
    </span>`);
  }
  for (const G of FILTER_GROUPS) {
    for (const v of state.filters[G.key]) {
      chips.push(`<span class="chip">
        <span>${escHtml(G.label)}: ${escHtml(label(v))}</span>
        <button class="chip-x" data-chip-group="${G.key}" data-chip-value="${escHtml(v)}" title="Treu filtre">
          <svg viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 1l6 6M7 1l-6 6"/></svg>
        </button>
      </span>`);
    }
  }
  els.chipRow.innerHTML = chips.join('');
}

function renderResults(filtered) {
  // Estat inicial "net": sense cap filtre ni cerca → no mostrem tots els
  // resultats (introdueix soroll), sinó dues bombolles d'orientació.
  if (isPristine()) {
    els.results.innerHTML = `
      <li class="state-hint">
        <div class="hint-bubble hint-bubble--search">
          <svg class="hint-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          <span>Podeu fer una cerca per paraula clau</span>
        </div>
        <div class="hint-bubble hint-bubble--filters">
          <svg class="hint-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          <span>Podeu escollir els filtres que convenen</span>
        </div>
      </li>`;
    return;
  }
  if (!filtered.length) {
    els.results.innerHTML = `
      <li class="state-empty">
        <div class="se-icon">∅</div>
        <p><strong>No s'ha trobat cap material.</strong></p>
        <p>Prova a treure algun filtre o revisa la cerca.</p>
        <button id="empty-reset">Restableix filtres</button>
      </li>`;
    const btn = $('empty-reset');
    if (btn) btn.onclick = clearAll;
    return;
  }

  els.results.innerHTML = filtered.map((f, idx) => {
    const isOpen = state.openId === f.id;
    const origin = f.origin || '';
    const fmtIcon = (f.format || '?').toUpperCase();

    const courseChips = (f.courses || []).map(c =>
      `<span class="pill pill-course">${escHtml(label(c))}</span>`).join('');

    const isLink = !!f.url;
    const openHref = isLink
      ? f.url
      : (f.format === 'doc'
          ? `https://docs.google.com/document/d/${encodeURIComponent(f.drive_id)}/edit`
          : `https://drive.google.com/file/d/${encodeURIComponent(f.drive_id)}/view`);
    const openLabel = isLink ? 'Obre la prova ↗' : 'Obre al Drive ↗';

    return `
      <li>
        <div class="card ${isOpen ? 'is-open' : ''}"
             data-id="${escHtml(f.id)}" data-idx="${idx}"
             data-format="${escHtml(f.format || '')}"
             data-origin="${escHtml(origin)}"
             tabindex="0" role="button" aria-expanded="${isOpen}">
          <div class="card-icon">${escHtml(fmtIcon)}</div>
          <div class="card-main">
            <div class="card-title">${escHtml(f.title)}</div>
            <div class="card-meta">
              ${courseChips}
              ${origin ? `<span class="pill pill-origin" data-origin="${escHtml(origin)}">${escHtml(label(origin))}</span>` : ''}
            </div>
          </div>
          <div class="card-actions">
            ${isLink ? '' : `<button class="btn-act btn-prim act-preview" data-id="${escHtml(f.id)}">Previsualitza</button>`}
            <a class="btn-act ${isLink ? 'btn-prim ' : ''}act-drive" href="${openHref}" target="_blank" rel="noopener">${openLabel}</a>
          </div>
        </div>
      </li>`;
  }).join('');
}

function renderPreview() {
  if (!state.previewing || !state.openId) {
    els.preview.hidden = true;
    els.layout.classList.remove('has-preview');
    return;
  }
  const f = state.manifest.files.find(x => x.id === state.openId);
  if (!f) {
    closePreview();
    return;
  }
  els.preview.hidden = false;
  els.layout.classList.add('has-preview');

  const previewSrc = f.url
    ? f.url
    : `https://drive.google.com/file/d/${encodeURIComponent(f.drive_id)}/preview`;

  els.preview.innerHTML = `
    <div class="preview-head">
      <div class="pv-title">${escHtml(f.title)}</div>
      <button class="pv-close" id="pv-close" title="Tanca (Esc)">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg>
      </button>
    </div>
    <div class="preview-body" id="pv-body">
      <iframe src="${previewSrc}" title="Visor de ${escHtml(f.title)}" allow="autoplay"></iframe>
    </div>
  `;

  $('pv-close').onclick = closePreview;
}

/* ═══════════════════════════════════════════════════════════════════
   ACTIONS — toggle card open, preview drawer
   ═══════════════════════════════════════════════════════════════════ */

/* Swap is-open class without touching the rest of the DOM */
function applyOpenState(prevId, newId) {
  if (prevId) {
    const el = els.results.querySelector(`.card[data-id="${CSS.escape(prevId)}"]`);
    if (el) { el.classList.remove('is-open'); el.setAttribute('aria-expanded', 'false'); }
  }
  if (newId) {
    const el = els.results.querySelector(`.card[data-id="${CSS.escape(newId)}"]`);
    if (el) { el.classList.add('is-open'); el.setAttribute('aria-expanded', 'true'); }
  }
}

function toggleOpen(id) {
  if (state.openId === id) { closeCard(); return; }
  const prevId = state.openId;
  state.openId = id;
  state.previewing = false;
  applyOpenState(prevId, id);
  renderPreview();
  syncToUrl(false);
}

function closeCard() {
  const prevId = state.openId;
  state.openId = null;
  state.previewing = false;
  applyOpenState(prevId, null);
  renderPreview();
  syncToUrl(false);
  // Retorna el focus a la targeta si l'usuari navega amb teclat.
  if (prevId) {
    const el = els.results.querySelector(`.card[data-id="${CSS.escape(prevId)}"]`);
    if (el && el.contains(document.activeElement)) el.focus();
  }
}

function openPreview(id) {
  // Web resources (proves CB, etc.) have no Drive preview — open externally.
  const wf = state.manifest?.files.find(x => x.id === id);
  if (wf && wf.url) {
    pushRecent(id);
    window.open(wf.url, '_blank', 'noopener');
    return;
  }
  const prevId = state.openId;
  state.openId = id;
  state.previewing = true;
  applyOpenState(prevId, id);
  renderPreview();
  syncToUrl(false);
}

function closePreview() {
  state.previewing = false;
  renderPreview();
  syncToUrl(false);
}

function clearAll() {
  state.query = '';
  els.search.value = '';
  FILTER_GROUPS.forEach(g => state.filters[g.key].clear());
  syncToUrl();
  renderAll();
}

/* ═══════════════════════════════════════════════════════════════════
   URL STATE
   ═══════════════════════════════════════════════════════════════════ */

function buildUrlParams({ openOnly } = {}) {
  const p = new URLSearchParams();
  if (state.query) p.set('q', state.query);
  for (const G of FILTER_GROUPS) {
    if (state.filters[G.key].size) {
      p.set(G.key, [...state.filters[G.key]].join(','));
    }
  }
  if (state.openId) p.set('open', state.openId);
  if (openOnly) {
    const o = new URLSearchParams();
    if (state.openId) o.set('open', state.openId);
    return o.toString();
  }
  return p.toString();
}

function syncToUrl(replace = true) {
  const qs = buildUrlParams();
  const url = location.pathname + (qs ? '?' + qs : '');
  if (replace) history.replaceState(null, '', url);
  else         history.pushState(null, '', url);
}

function syncFromUrl() {
  const p = new URLSearchParams(location.search);
  state.query = p.get('q') || '';
  els.search.value = state.query;
  for (const G of FILTER_GROUPS) {
    state.filters[G.key].clear();
    const v = p.get(G.key);
    if (v) v.split(',').forEach(x => x && state.filters[G.key].add(x));
  }
  state.openId = p.get('open') || null;
}

/* ═══════════════════════════════════════════════════════════════════
   GLUE — render everything
   ═══════════════════════════════════════════════════════════════════ */

function renderAll() {
  renderFilters();
  renderChips();
  renderResults(computeFiltered());
  renderPreview();
}

/* ═══════════════════════════════════════════════════════════════════
   EVENT WIRING
   ═══════════════════════════════════════════════════════════════════ */

let searchTimer = 0;
els.search.addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.query = e.target.value.trim();
    syncToUrl();
    renderAll();
  }, 120);
});

els.filterRail.addEventListener('change', e => {
  const cb = e.target.closest('input[type=checkbox][data-group]');
  if (!cb) return;
  const g = cb.dataset.group, v = cb.dataset.value;
  if (cb.checked) state.filters[g].add(v);
  else            state.filters[g].delete(v);
  syncToUrl();
  renderAll();
});

els.filterRail.addEventListener('click', e => {
  if (e.target.closest('.clear-all')) {
    clearAll();
    return;
  }
  // Track collapse/expand of filter groups
  const summary = e.target.closest('summary');
  if (summary) {
    const det = summary.parentElement;
    // <details> toggles AFTER the event; defer
    setTimeout(() => {
      const g = det.dataset.group;
      state.filterCollapsed[g] = !det.open;
    }, 0);
  }
});

els.chipRow.addEventListener('click', e => {
  const btn = e.target.closest('button.chip-x');
  if (!btn) return;
  if (btn.dataset.chipClear === 'query') {
    state.query = '';
    els.search.value = '';
  } else if (btn.dataset.chipGroup) {
    state.filters[btn.dataset.chipGroup].delete(btn.dataset.chipValue);
  }
  syncToUrl();
  renderAll();
});

els.results.addEventListener('click', e => {
  // "Previsualitza" button → open side drawer with iframe.
  const pv = e.target.closest('button.act-preview');
  if (pv) {
    e.stopPropagation();
    openPreview(pv.dataset.id);
    return;
  }
  // "Obre al Drive" link → record as recent, then let the browser open it.
  const drive = e.target.closest('a.act-drive');
  if (drive) {
    e.stopPropagation();
    const card = drive.closest('.card');
    if (card) pushRecent(card.dataset.id);
    return;
  }
  // Click on the card body → toggle action buttons.
  const card = e.target.closest('.card');
  if (card) toggleOpen(card.dataset.id);
});

// A1 — Operació amb teclat: Enter/Espai obren la targeta enfocada.
els.results.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.card[role="button"]');
  if (!card) return;
  if (e.key === ' ') e.preventDefault(); // evita scroll de pàgina
  const id = card.dataset.id;
  toggleOpen(id);
  // En obrir, mou el focus al primer botó d'acció.
  if (state.openId === id) {
    const firstBtn = card.querySelector('.card-actions .btn-act');
    if (firstBtn) firstBtn.focus();
  }
});

document.addEventListener('keydown', e => {
  // Escape closes the side preview first; on a second press, collapses the card.
  if (e.key === 'Escape') {
    if (!els.configMenu.hidden)  { toggleConfigMenu(false); return; }
    if (!els.recentsMenu.hidden) { toggleRecentsMenu(false); return; }
    if (state.previewing) closePreview();
    else if (state.openId) closeCard();
  }
});

/* Configuració button + dropdown */
els.configBtn.addEventListener('click', e => {
  e.stopPropagation();
  toggleConfigMenu();
});

/* Recents button + dropdown */
els.recentsBtn.addEventListener('click', e => {
  e.stopPropagation();
  toggleRecentsMenu();
});
els.recentsMenu.addEventListener('click', e => {
  const item = e.target.closest('.rec-item');
  if (!item) return;
  const id = item.dataset.id;
  toggleRecentsMenu(false);
  // Selecting a recent re-opens it in the preview drawer.
  openPreview(id);
  const card = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
// Clicking a menu item (now opens in a new tab) closes the Edició menu.
els.configMenu.addEventListener('click', e => {
  if (e.target.closest('.config-item')) toggleConfigMenu(false);
});
// Click outside closes the dropdowns.
document.addEventListener('click', e => {
  if (!els.recentsMenu.hidden && !els.recentsWrap.contains(e.target)) {
    toggleRecentsMenu(false);
  }
  if (!els.configMenu.hidden && !els.configWrap.contains(e.target)) {
    toggleConfigMenu(false);
  }
});

window.addEventListener('popstate', () => {
  syncFromUrl();
  renderAll();
});

/* ═══════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════ */

async function loadManifest() {
  const res = await fetch(MANIFEST_URL, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`HTTP ${res.status} en carregar ${MANIFEST_URL}`);
  const data = await res.json();
  // Validate basics
  if (!data.vocabulary || !Array.isArray(data.files)) {
    throw new Error('Manifest invàlid: falta "vocabulary" o "files".');
  }
  // Build search blob per file
  for (const f of data.files) {
    const parts = [
      f.title || '', f.notes || '',
      ...(f.courses || []).map(label),
      label(f.origin || ''),
      label(f.math_sense || ''),
      ...(f.activities || []).map(label),
      label(f.type || ''),
      // Also include raw values so people can search "1ESO" literally
      ...(f.courses || []),
      f.origin || '', f.math_sense || '',
      ...(f.activities || []),
      f.type || '', f.format || ''
    ];
    f._blob = normalize(parts.join(' '));
    // Blobs parcials per ponderar el rànquing (E2): títol × 3, camps principals × 2, notes × 1
    f._blobTitle = normalize(f.title || '');
    f._blobMain  = normalize([
      ...(f.courses || []).map(label),
      label(f.origin || ''),
      label(f.math_sense || ''),
      ...(f.activities || []).map(label),
      label(f.type || ''),
      ...(f.courses || []),
      f.origin || '', f.math_sense || '',
      ...(f.activities || []),
      f.type || '', f.format || ''
    ].join(' '));
  }
  return data;
}

function showLoading() {
  els.results.innerHTML = Array.from({length: 5}).map(() => `<li class="skel"></li>`).join('');
}

function showError(err) {
  els.results.innerHTML = `
    <li class="state-error">
      <p><strong>No s'ha pogut carregar el manifest.</strong></p>
      <p>${escHtml(err.message)}</p>
      <p>Comprova que <code>${escHtml(MANIFEST_URL)}</code> existeixi i sigui accessible.</p>
    </li>`;
}

async function init() {
  showLoading();
  // Wire the static mode toggle (it lives in the topbar, not in the rail).
  $('mode-basic').onclick    = () => setMode('basic');
  $('mode-advanced').onclick = () => setMode('advanced');
  try {
    // Restaure ui mode from localStorage (default: basic).
    try {
      const saved = localStorage.getItem('material:uiMode');
      if (saved === 'basic' || saved === 'advanced') state.uiMode = saved;
    } catch (e) {}
    state.manifest = await loadManifest();
    state.vocabLabels = state.manifest.vocabulary_labels || {};
    syncFromUrl();
    renderAll();
    // Scroll-to-open if preview was deep-linked
    if (state.openId) {
      setTimeout(() => {
        const card = document.querySelector(`.card[data-id="${CSS.escape(state.openId)}"]`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    }
  } catch (err) {
    console.error(err);
    showError(err);
  }
}

init();
</script>
